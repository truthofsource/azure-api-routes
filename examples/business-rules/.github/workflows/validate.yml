name: Validate public reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - run: node --experimental-strip-types --test src/payrollPacketDiscard.test.ts src/wageRules.test.ts
      - run: python -B scripts/demo.py
