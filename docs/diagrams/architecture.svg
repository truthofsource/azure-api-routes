<text x="408.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">SQL transaction</text>
<text x="408.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Saves the timesheet and its history</text>
<text x="408.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">together.</text>
</g>
<g data-node="n4_1"><rect x="617.0" y="1118" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="1130" data-purpose-icon="n4_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0" /></g></svg>
<text x="792.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">SQL transaction</text>
<text x="792.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Saves the application and its related</text>
<text x="792.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">records together.</text>
</g>
