<text x="408.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">API response</text>
<text x="408.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Tells the page whether the timesheet was</text>
<text x="408.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">saved.</text>
</g>
<g data-node="n5_1"><rect x="617.0" y="1356" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="1368" data-purpose-icon="n5_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9l-6 4V5a2 2 0 0 1 1-2Z" /><path d="M7 8h11M7 13h8" /></g></svg>
<text x="792.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">API response</text>
<text x="792.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Tells the applicant what was saved and what</text>
