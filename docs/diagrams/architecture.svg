<text x="408.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">POST /api/timesheets</text>
<text x="408.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Receives an employee's submitted working</text>
<text x="408.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">hours.</text>
</g>
<g data-node="n1_1"><rect x="617.0" y="404" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="416" data-purpose-icon="n1_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="m8 9-3 3 3 3m8-6 3 3-3 3m-3-7-2 8" /></g></svg>
<text x="792.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">POST /api/publicemploymentapplications</text>
<text x="792.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Receives an application without requiring a</text>
<text x="792.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">staff account.</text>
</g>
<g data-node="n2_0"><rect x="233.0" y="642" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3" /><path d="M2 20v-2a7 7 0 0 1 11-5m4-2 5 2v4c0 3-5 5-5 5s-5-2-5-5v-4l5-2Z" /></g></svg>
<text x="408.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Identity and record access</text>
<text x="408.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Checks who signed in and which records they</text>
<text x="408.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">may use.</text>
</g>
<g data-node="n2_1"><rect x="617.0" y="642" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="654" data-purpose-icon="n2_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="15" height="18" rx="2" /><path d="M9 4V2h7v2m-9 6 1 1 2-2m2 1h5m-10 5 1 1 2-2m2 1h5m-10 4h10" /></g></svg>
<text x="792.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Submission checks</text>
<text x="792.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Checks the answers and spots repeated</text>
<text x="792.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">submissions.</text>
</g>
<g data-node="n3_0"><rect x="233.0" y="880" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 3" /></g></svg>
<text x="408.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Timesheet rules</text>
<text x="408.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Checks that dates, hours and confirmation</text>
<text x="408.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">meet the rules.</text>
</g>
<g data-node="n3_1"><rect x="617.0" y="880" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
