<text x="792.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Application rules</text>
<text x="792.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Makes repeat requests safe and checks</text>
<text x="792.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">related records.</text>
</g>
